<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transporte CMUDE 2026</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --azul: #1a56db; --azul-claro: #e8f0fe; --azul-texto: #1e40af;
    --verde: #166534; --verde-claro: #dcfce7;
    --rojo: #991b1b; --rojo-claro: #fee2e2;
    --naranja: #92400e; --naranja-claro: #fef3c7;
    --gris-claro: #f3f4f6; --gris-borde: #e5e7eb;
    --texto: #111827; --texto-muted: #6b7280; --blanco: #ffffff;
    --radio: 10px; --radio-lg: 14px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f4ff; color: var(--texto); min-height: 100vh; font-size: 14px; }

  .header { background: var(--blanco); border-bottom: 1px solid var(--gris-borde); padding: 0 20px; position: sticky; top: 0; z-index: 50; }
  .header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 34px; height: 34px; background: var(--azul); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .logo-titulo { font-weight: 600; font-size: 15px; }
  .logo-subtitulo { font-size: 11px; color: var(--texto-muted); margin-top: 1px; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 6px 14px; border-radius: var(--radio); border: 1px solid transparent; background: none; font-size: 13px; font-weight: 500; color: var(--texto-muted); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .tab.activo { background: var(--azul); color: white; border-color: var(--azul); }
  .tab:not(.activo):hover { background: var(--gris-claro); color: var(--texto); }
  .hora-reloj { font-size: 12px; color: var(--texto-muted); white-space: nowrap; display: flex; align-items: center; gap: 5px; }

  .main { max-width: 960px; margin: 0 auto; padding: 20px; }

  .metricas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  .metrica { background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: var(--radio-lg); padding: 14px 16px; }
  .metrica-label { font-size: 11px; color: var(--texto-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .metrica-valor { font-size: 26px; font-weight: 600; line-height: 1; }
  .metrica-valor.verde { color: var(--verde); }
  .metrica-valor.azul { color: var(--azul); }
  .metrica-valor.rojo { color: var(--rojo); }

  .filtros { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .filtro-btn { padding: 5px 13px; border-radius: 20px; border: 1px solid var(--gris-borde); background: var(--blanco); font-size: 12px; color: var(--texto-muted); cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
  .filtro-btn:hover { border-color: #9ca3af; color: var(--texto); }
  .filtro-btn.activo { background: var(--texto); color: white; border-color: var(--texto); }
  .badge-count { border-radius: 10px; padding: 0 5px; font-size: 11px; font-weight: 600; }
  .filtro-btn.activo .badge-count { background: rgba(255,255,255,0.25); }
  .filtro-btn:not(.activo) .badge-count { background: var(--gris-claro); color: var(--texto-muted); }

  .proximas { background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: var(--radio-lg); margin-bottom: 20px; overflow: hidden; }
  .proximas-cabecera { display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; user-select: none; transition: background 0.15s; }
  .proximas-cabecera:hover { background: var(--gris-claro); }
  .proximas-resumen { flex: 1; min-width: 0; }
  .proximas-proximo { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proximas-proximo span { color: var(--azul-texto); }
  .proximas-subtexto { font-size: 11px; color: var(--texto-muted); margin-top: 1px; }
  .proximas-chevron { flex-shrink: 0; color: var(--texto-muted); transition: transform 0.2s; }
  .proximas-chevron.abierto { transform: rotate(180deg); }
  .proximas-detalle { border-top: 1px solid var(--gris-borde); padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  .proxima-fila { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radio); background: var(--gris-claro); }
  .proxima-fila.siguiente { background: var(--azul-claro); }
  .proxima-hora { font-size: 14px; font-weight: 700; min-width: 44px; }
  .proxima-fila.siguiente .proxima-hora { color: var(--azul-texto); }
  .proxima-sep { width: 1px; height: 20px; background: var(--gris-borde); flex-shrink: 0; }
  .proxima-fila.siguiente .proxima-sep { background: #bfdbfe; }
  .proxima-info { flex: 1; min-width: 0; font-size: 12px; }
  .proxima-bus { font-weight: 600; }
  .proxima-destino { color: var(--texto-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proxima-asientos { font-size: 12px; color: var(--texto-muted); flex-shrink: 0; }
  .proxima-asientos strong { color: var(--texto); }

  .grid-buses { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .tarjeta { background: var(--blanco); border: 1px solid var(--gris-borde); border-radius: var(--radio-lg); padding: 16px; transition: box-shadow 0.15s; }
  .tarjeta:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .tarjeta-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .bus-numero { font-size: 17px; font-weight: 600; }
  .bus-destino { font-size: 12px; color: var(--texto-muted); margin-top: 2px; display: flex; align-items: center; gap: 4px; }

  .estado-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .estado-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .estado-esperando { background: #f3f4f6; color: #374151; }
  .estado-esperando .dot { background: #9ca3af; }
  .estado-disponible { background: var(--verde-claro); color: var(--verde); }
  .estado-disponible .dot { background: #22c55e; animation: pulso 2s infinite; }
  .estado-lleno { background: var(--rojo-claro); color: var(--rojo); }
  .estado-lleno .dot { background: #ef4444; }
  .estado-en_ruta { background: var(--azul-claro); color: var(--azul-texto); }
  .estado-en_ruta .dot { background: #3b82f6; animation: pulso 1.5s infinite; }
  .estado-finalizado { background: #f3f4f6; color: #6b7280; }
  .estado-finalizado .dot { background: #d1d5db; }
  .estado-no_disponible { background: #1f2937; color: #9ca3af; }
  .estado-no_disponible .dot { background: #4b5563; }
  @keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .barra-wrap { margin: 10px 0; }
  .barra-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--texto-muted); margin-bottom: 4px; }
  .barra-asientos-num { font-size: 15px; font-weight: 600; color: var(--texto); }
  .barra-track { height: 7px; background: var(--gris-claro); border-radius: 4px; overflow: hidden; }
  .barra-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
  .horarios { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .horario-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--texto-muted); }
  .horario-item strong { color: var(--texto); font-weight: 600; }
  .obs { margin-top: 8px; padding: 6px 10px; background: var(--naranja-claro); color: var(--naranja); border-radius: 7px; font-size: 12px; display: flex; align-items: flex-start; gap: 5px; }
  .gps-btn { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 6px; background: var(--azul-claro); color: var(--azul-texto); font-size: 11px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; margin-top: 6px; }
  .btn-editar { padding: 4px 8px; border-radius: 7px; border: 1px solid var(--gris-borde); background: none; color: var(--texto-muted); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 3px; transition: all 0.15s; }
  .btn-editar:hover { background: var(--gris-claro); color: var(--texto); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
  .modal { background: var(--blanco); border-radius: var(--radio-lg); padding: 22px; width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modal-titulo { font-size: 16px; font-weight: 600; }
  .modal-cerrar { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--gris-borde); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--texto-muted); font-size: 17px; }
  .campo { margin-bottom: 14px; }
  .campo label { display: block; font-size: 12px; color: var(--texto-muted); margin-bottom: 5px; font-weight: 500; }
  .campo input, .campo select, .campo textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--gris-borde); border-radius: var(--radio); font-size: 14px; color: var(--texto); background: var(--blanco); font-family: inherit; transition: border-color 0.15s; }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
  .campo textarea { resize: vertical; min-height: 60px; }
  .asientos-control { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .asientos-btn { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--gris-borde); background: var(--gris-claro); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--texto); transition: all 0.1s; user-select: none; }
  .asientos-btn:active { transform: scale(0.92); }
  .asientos-num { flex: 1; text-align: center; font-size: 22px; font-weight: 600; }
  .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
  .btn-cancelar { flex: 1; padding: 10px; border-radius: var(--radio); border: 1px solid var(--gris-borde); background: none; font-size: 14px; color: var(--texto-muted); cursor: pointer; font-family: inherit; }
  .btn-guardar { flex: 1; padding: 10px; border-radius: var(--radio); border: none; background: var(--azul); color: white; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; }
  .btn-guardar:hover { background: #1e40af; }
  .btn-guardar:disabled { background: #93c5fd; cursor: not-allowed; }

  .aviso-voluntario { margin-top: 20px; padding: 14px 16px; background: var(--azul-claro); border-radius: var(--radio-lg); border: 1px solid #bfdbfe; font-size: 13px; color: var(--azul-texto); line-height: 1.6; }
  .aviso-voluntario strong { font-weight: 600; }
  .vacio { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--texto-muted); font-size: 14px; }

  .cargando { text-align: center; padding: 60px 20px; color: var(--texto-muted); font-size: 14px; }
  .indicador-sync { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--texto-muted); }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; animation: pulso 2s infinite; }

  @media (max-width: 600px) {
    .metricas { grid-template-columns: repeat(2, 1fr); }
    .header-inner { flex-wrap: wrap; height: auto; padding: 10px 0; gap: 8px; }
    .hora-reloj { display: none; }
    .main { padding: 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="cargando">Cargando datos de transporte...</div>
</div>

<script>
// ════════════════════════════════════════════
// ⚠️  REEMPLAZA ESTA URL CON LA DE TU APPS SCRIPT
const API_URL = "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT";
// ════════════════════════════════════════════

const ESTADOS = {
  esperando:      { label: "Esperando",      clase: "estado-esperando" },
  disponible:     { label: "Disponible",     clase: "estado-disponible" },
  lleno:          { label: "Lleno",          clase: "estado-lleno" },
  en_ruta:        { label: "En ruta",        clase: "estado-en_ruta" },
  finalizado:     { label: "Finalizado",     clase: "estado-finalizado" },
  no_disponible:  { label: "No disponible",  clase: "estado-no_disponible" },
};

let buses = [];
let vistaActual = "publica";
let filtroActual = "todos";
let editandoBus = null;
let proximasAbiertas = false;
let guardando = false;
let ultimaSync = null;

async function cargarDatos() {
  try {
    const res = await fetch(API_URL);
    const json = await res.json();
    if (json.ok) {
      buses = json.buses;
      ultimaSync = new Date();
      render();
    }
  } catch(e) {
    console.error("Error al cargar datos:", e);
  }
}

async function guardarEnSheet(id, cambios) {
  guardando = true;
  render();
  try {
    await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify({ id, ...cambios }),
    });
    await cargarDatos();
  } catch(e) {
    console.error("Error al guardar:", e);
  } finally {
    guardando = false;
    editandoBus = null;
    render();
  }
}

function horaActual() {
  return new Date().toLocaleTimeString("es-EC", { hour: "2-digit", minute: "2-digit" });
}

function colorBarra(pct) {
  if (pct < 40) return "#22c55e";
  if (pct < 75) return "#f59e0b";
  return "#ef4444";
}

const ICONS = {
  bus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M7 18v2M17 18v2"/></svg>`,
  ojo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
  engranaje: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  pin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  reloj: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  alerta: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  editar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  gps: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>`,
  flecha_abajo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>`,
  flecha_arriba: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  chevron: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
};

function icon(name, size = 16) {
  return `<span style="display:inline-flex;align-items:center;width:${size}px;height:${size}px;flex-shrink:0">${ICONS[name]}</span>`;
}

function calcResumen() {
  return {
    disponibles: buses.filter(b => b.estado === "disponible").length,
    enRuta: buses.filter(b => b.estado === "en_ruta").length,
    llenos: buses.filter(b => b.estado === "lleno").length,
    asientosTotales: buses.reduce((s, b) => s + b.asientos, 0),
  };
}

function htmlProximasLlegadas() {
  const pendientes = buses
    .filter(b => b.mostrarEnProximas && b.horaEstimada && (b.estado === "esperando" || b.estado === "en_ruta") && !b.horaLlegada)
    .sort((a, b) => a.horaEstimada.localeCompare(b.horaEstimada));
  if (pendientes.length === 0) return "";
  const siguiente = pendientes[0];
  const resto = pendientes.length - 1;
  const cabecera = `
    <div class="proximas-cabecera" onclick="toggleProximas()">
      <div class="proximas-resumen">
        <div class="proximas-proximo">Próximo: <span>${siguiente.horaEstimada}</span> · Bus ${String(siguiente.id).padStart(2,"0")} · ${siguiente.destino}</div>
        <div class="proximas-subtexto">${siguiente.asientos} asientos libres${resto > 0 ? ` · ${resto} bus${resto > 1 ? "es" : ""} más` : ""}</div>
      </div>
      <div class="proximas-chevron ${proximasAbiertas ? "abierto" : ""}">${icon("chevron", 16)}</div>
    </div>`;
  if (!proximasAbiertas) return `<div class="proximas">${cabecera}</div>`;
  const filas = pendientes.map((bus, i) => `
    <div class="proxima-fila ${i === 0 ? "siguiente" : ""}">
      <div class="proxima-hora">${bus.horaEstimada}</div>
      <div class="proxima-sep"></div>
      <div class="proxima-info"><div class="proxima-bus">Bus ${String(bus.id).padStart(2, "0")}</div><div class="proxima-destino">${bus.destino}</div></div>
      <div class="proxima-asientos"><strong>${bus.asientos}</strong> libres</div>
    </div>`).join("");
  return `<div class="proximas">${cabecera}<div class="proximas-detalle">${filas}</div></div>`;
}

function htmlTarjeta(bus) {
  const pct = Math.round(((bus.capacidad - bus.asientos) / bus.capacidad) * 100);
  const est = ESTADOS[bus.estado];
  const esVol = vistaActual === "voluntario";
  return `
    <div class="tarjeta">
      <div class="tarjeta-header">
        <div>
          <div class="bus-numero">Bus ${String(bus.id).padStart(2, "0")}</div>
          <div class="bus-destino">${icon("pin", 13)} ${bus.destino}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="estado-badge ${est.clase}"><span class="dot"></span>${est.label}</span>
          ${esVol ? `<button class="btn-editar" onclick="abrirModal(${bus.id})">${icon("editar", 13)} Editar</button>` : ""}
        </div>
      </div>
      <div class="barra-wrap">
        <div class="barra-info">
          <span style="display:flex;align-items:baseline;gap:4px"><span class="barra-asientos-num">${bus.asientos}</span><span>asientos libres</span></span>
          <span>${bus.capacidad - bus.asientos} ocupados de ${bus.capacidad}</span>
        </div>
        <div class="barra-track"><div class="barra-fill" style="width:${pct}%;background:${colorBarra(pct)}"></div></div>
      </div>
      <div class="horarios">
        ${bus.horaEstimada && !bus.horaLlegada ? `<div class="horario-item" style="color:#1e40af">${icon("reloj", 14)} Hora de embarque: <strong style="color:#1e40af">${bus.horaEstimada}</strong></div>` : ""}
        ${bus.horaLlegada ? `<div class="horario-item">${icon("flecha_abajo", 14)} Llegó: <strong>${bus.horaLlegada}</strong></div>` : ""}
        ${bus.horaSalida  ? `<div class="horario-item">${icon("flecha_arriba", 14)} Salió: <strong>${bus.horaSalida}</strong></div>` : ""}
        ${!bus.horaEstimada && !bus.horaLlegada && !bus.horaSalida ? `<div class="horario-item" style="color:#9ca3af">${icon("reloj", 14)} Sin horario aún</div>` : ""}
      </div>
      ${bus.gpsLink ? `<a href="${bus.gpsLink}" target="_blank" class="gps-btn">${icon("gps", 12)} Ver ubicación GPS</a>` : ""}
      ${bus.observaciones ? `<div class="obs">${icon("alerta", 13)} ${bus.observaciones}</div>` : ""}
    </div>`;
}

function htmlModal(bus) {
  return `
    <div class="modal-overlay" id="modal-overlay" onclick="clicFueraModal(event)">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-titulo">Editar Bus ${String(bus.id).padStart(2, "0")}</span>
          <button class="modal-cerrar" onclick="cerrarModal()">${icon("x", 15)}</button>
        </div>
        <div class="campo"><label>Destino</label><input type="text" id="f-destino" value="${bus.destino}" /></div>
        <div class="campo"><label>Estado</label>
          <select id="f-estado">
            ${Object.entries(ESTADOS).map(([k, v]) => `<option value="${k}" ${bus.estado === k ? "selected" : ""}>${v.label}</option>`).join("")}
          </select>
        </div>
        <div class="campo">
          <label>Asientos disponibles (de ${bus.capacidad})</label>
          <div class="asientos-control">
            <button class="asientos-btn" onclick="cambiarAsientos(-1)">−</button>
            <div class="asientos-num" id="f-asientos-num">${bus.asientos}</div>
            <button class="asientos-btn" onclick="cambiarAsientos(1)">+</button>
          </div>
          <input type="hidden" id="f-asientos" value="${bus.asientos}" />
        </div>
        <div class="campo"><label>Hora de embarque (itinerario base)</label><input type="text" id="f-horaEstimada" placeholder="ej: 10:00" value="${bus.horaEstimada || ""}" /></div>
        <div class="campo"><label>Hora de llegada real</label><input type="text" id="f-horaLlegada" placeholder="—" value="${bus.horaLlegada || ""}" /></div>
        <div class="campo"><label>Hora de salida</label><input type="text" id="f-horaSalida" placeholder="—" value="${bus.horaSalida || ""}" /></div>
        <div class="campo"><label>Link GPS (desde WhatsApp)</label><input type="text" id="f-gpsLink" placeholder="https://maps.app.goo.gl/..." value="${bus.gpsLink || ""}" /></div>
        <div class="campo"><label>Observaciones</label><textarea id="f-observaciones">${bus.observaciones || ""}</textarea></div>
        <div class="modal-btns">
          <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
          <button class="btn-guardar" id="btn-guardar-modal" onclick="guardarBus(${bus.id})" ${guardando ? "disabled" : ""}>
            ${guardando ? "Guardando..." : "Guardar cambios"}
          </button>
        </div>
      </div>
    </div>`;
}

function render() {
  if (buses.length === 0) return;
  const res = calcResumen();
  const busesFiltrados = filtroActual === "todos" ? buses : buses.filter(b => b.estado === filtroActual);
  const conteosFiltro = {};
  Object.keys(ESTADOS).forEach(k => { conteosFiltro[k] = buses.filter(b => b.estado === k).length; });
  const syncTexto = ultimaSync
    ? `<span class="indicador-sync"><span class="sync-dot"></span>Actualizado ${ultimaSync.toLocaleTimeString("es-EC", {hour:"2-digit",minute:"2-digit"})}</span>`
    : "";

  document.getElementById("app").innerHTML = `
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <div class="logo-icon">${icon("bus", 18)}</div>
          <div>
            <div class="logo-titulo">Transporte CMUDE 2026</div>
            <div class="logo-subtitulo">Quito · ${buses.length} buses · capacidad ${buses.reduce((s,b)=>s+b.capacidad,0)}</div>
          </div>
        </div>
        <div class="tabs">
          <button class="tab ${vistaActual === "publica" ? "activo" : ""}" onclick="cambiarVista('publica')">${icon("ojo", 14)} Participantes</button>
          <button class="tab ${vistaActual === "voluntario" ? "activo" : ""}" onclick="cambiarVista('voluntario')">${icon("engranaje", 14)} Voluntarios</button>
        </div>
        <div class="hora-reloj">${syncTexto}</div>
      </div>
    </header>
    <main class="main">
      <div class="metricas">
        <div class="metrica"><div class="metrica-label">Disponibles</div><div class="metrica-valor verde">${res.disponibles}</div></div>
        <div class="metrica"><div class="metrica-label">En ruta</div><div class="metrica-valor azul">${res.enRuta}</div></div>
        <div class="metrica"><div class="metrica-label">Llenos</div><div class="metrica-valor rojo">${res.llenos}</div></div>
        <div class="metrica"><div class="metrica-label">Asientos libres</div><div class="metrica-valor">${res.asientosTotales}</div></div>
      </div>
      ${vistaActual === "publica" ? htmlProximasLlegadas() : ""}
      <div class="filtros">
        <button class="filtro-btn ${filtroActual === "todos" ? "activo" : ""}" onclick="cambiarFiltro('todos')">Todos <span class="badge-count">${buses.length}</span></button>
        ${Object.entries(ESTADOS).map(([k, v]) => `<button class="filtro-btn ${filtroActual === k ? "activo" : ""}" onclick="cambiarFiltro('${k}')">${v.label} <span class="badge-count">${conteosFiltro[k]}</span></button>`).join("")}
      </div>
      <div class="grid-buses">
        ${busesFiltrados.length > 0 ? busesFiltrados.map(htmlTarjeta).join("") : `<div class="vacio">No hay buses en este estado.</div>`}
      </div>
      ${vistaActual === "voluntario" ? `
        <div class="aviso-voluntario">
          ${icon("info", 15)}
          <div style="margin-left:6px"><strong>Modo voluntario activo.</strong> Toca "Editar" en tu bus para actualizar asientos, estado, horarios y el link GPS. Los cambios se guardan en tiempo real para todos.</div>
        </div>` : ""}
    </main>
    ${editandoBus ? htmlModal(editandoBus) : ""}`;
}

function toggleProximas() { proximasAbiertas = !proximasAbiertas; render(); }
function cambiarVista(v) { vistaActual = v; editandoBus = null; render(); }
function cambiarFiltro(f) { filtroActual = f; render(); }
function abrirModal(id) { editandoBus = buses.find(b => b.id === id); render(); }
function cerrarModal() { editandoBus = null; render(); }
function clicFueraModal(e) { if (e.target.id === "modal-overlay") cerrarModal(); }

function cambiarAsientos(delta) {
  const input = document.getElementById("f-asientos");
  const num = document.getElementById("f-asientos-num");
  let val = parseInt(input.value) + delta;
  val = Math.max(0, Math.min(editandoBus.capacidad, val));
  input.value = val;
  num.textContent = val;
}

function guardarBus(id) {
  const cambios = {
    destino:       document.getElementById("f-destino").value.trim(),
    estado:        document.getElementById("f-estado").value,
    asientos:      parseInt(document.getElementById("f-asientos").value),
    horaEstimada:  document.getElementById("f-horaEstimada").value.trim(),
    horaLlegada:   document.getElementById("f-horaLlegada").value.trim(),
    horaSalida:    document.getElementById("f-horaSalida").value.trim(),
    gpsLink:       document.getElementById("f-gpsLink").value.trim(),
    observaciones: document.getElementById("f-observaciones").value.trim(),
  };
  guardarEnSheet(id, cambios);
}

// Carga inicial y refresco cada 15 segundos
cargarDatos();
setInterval(cargarDatos, 15000);
</script>
</body>
</html>
