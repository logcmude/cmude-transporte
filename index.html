<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Transporte CMUDE 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1a56db;--azul-cl:#dbeafe;--azul-tx:#1e40af;
  --verde:#15803d;--verde-cl:#dcfce7;
  --rojo:#b91c1c;--rojo-cl:#fee2e2;
  --naranja:#92400e;--naranja-cl:#fef3c7;
  --gris:#6b7280;--gris-cl:#f3f4f6;--borde:#e5e7eb;
  --texto:#111827;--blanco:#ffffff;
  --r:10px;--rlg:14px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;color:var(--texto);min-height:100vh;font-size:14px}
@keyframes pulso{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}

/* HEADER + BANNER sticky juntos */
.hdr{background:var(--blanco);border-bottom:1px solid var(--borde);padding:0 20px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.hdr-in{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:54px;gap:12px}
.logo{display:flex;align-items:center;gap:9px}
.logo-ic{width:34px;height:34px;background:var(--azul);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-ic svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo-txt{font-weight:700;font-size:15px;letter-spacing:-.3px}
.modo-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;font-size:12px;font-weight:700}
.modo-vol{background:var(--naranja-cl);color:var(--naranja)}
.modo-adm{background:#1e3a8a;color:#fff}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulso 2s infinite;flex-shrink:0}

/* BANNER dentro del header */
.banner{background:linear-gradient(135deg,#1e3a8a,#1e40af);padding:0 20px;display:none}
.banner.on{display:block}
.banner-in{max-width:960px;margin:0 auto;padding:11px 0 13px;display:flex;gap:12px;align-items:flex-start}
.banner-ic{flex-shrink:0;width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center}
.banner-ic svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.banner-tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#93c5fd;margin-bottom:3px}
.banner-msg{font-size:13px;font-weight:500;color:#fff;line-height:1.5}

/* PRÓXIMOS */
.prox-sec{background:var(--blanco);border-bottom:1px solid var(--borde);padding:0 20px}
.prox-in{max-width:960px;margin:0 auto;padding:11px 0}
.sec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--gris);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.prox-list{display:flex;flex-direction:column;gap:6px}
.prox-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);border:1.5px solid}
.prox-row.ahora{background:var(--verde-cl);border-color:#86efac}
.prox-row.pronto{background:var(--azul-cl);border-color:#93c5fd}
.prox-hora{font-size:15px;font-weight:800;min-width:50px;line-height:1}
.prox-row.ahora .prox-hora{color:var(--verde)}
.prox-row.pronto .prox-hora{color:var(--azul-tx)}
.prox-div{width:1px;height:26px;flex-shrink:0}
.prox-row.ahora .prox-div{background:#86efac}
.prox-row.pronto .prox-div{background:#93c5fd}
.prox-data{flex:1;min-width:0}
.prox-placa{font-size:12px;font-weight:700;color:var(--texto)}
.prox-ruta{font-size:11px;color:var(--gris);margin-top:2px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prox-pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;padding:3px 8px;border-radius:6px;flex-shrink:0}
.prox-row.ahora .prox-pill{background:var(--verde);color:#fff}
.prox-row.pronto .prox-pill{background:var(--azul);color:#fff}

/* FILTROS */
.filt-sec{padding:0 20px}
.filt-in{max-width:960px;margin:0 auto;padding:13px 0 9px;display:flex;gap:6px;flex-wrap:wrap}
.fb{padding:5px 12px;border-radius:20px;border:1px solid var(--borde);background:var(--blanco);font-size:12px;font-weight:500;color:var(--gris);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.fb:hover{border-color:#9ca3af;color:var(--texto)}
.fb.on{background:var(--texto);color:#fff;border-color:var(--texto)}
.fb .ct{border-radius:9px;padding:0 5px;font-size:10px;font-weight:700}
.fb.on .ct{background:rgba(255,255,255,.25)}
.fb:not(.on) .ct{background:var(--gris-cl);color:var(--gris)}

/* GRID */
.main{max-width:960px;margin:0 auto;padding:14px 20px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}

/* TARJETAS — colores por estado */
.card{border-radius:var(--rlg);padding:16px;border:1.5px solid var(--borde);background:var(--blanco);transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}

.card.esperando{background:var(--blanco);border-color:var(--borde)}
.card.embarcando{background:#f0fdf4;border-color:#86efac}
.card.en_ruta{background:#eff6ff;border-color:#93c5fd}
.card.finalizado{background:#f9fafb;border-color:var(--borde);opacity:.7}
.card.no_disponible{background:#f9fafb;border-color:var(--borde);opacity:.45}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}

/* Placa como título principal */
.card-placa{font-size:17px;font-weight:800;letter-spacing:.3px;color:var(--texto)}
.card-num{font-size:11px;color:var(--gris);margin-top:2px;font-weight:500}

/* badge estado */
.est{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.est .dot{width:6px;height:6px;border-radius:50%}
.e-esperando{background:#f3f4f6;color:#374151} .e-esperando .dot{background:#9ca3af}
.e-embarcando{background:var(--verde-cl);color:var(--verde)} .e-embarcando .dot{background:#22c55e;animation:pulso 1.5s infinite}
.e-en_ruta{background:var(--azul-cl);color:var(--azul-tx)} .e-en_ruta .dot{background:#3b82f6;animation:pulso 2s infinite}
.e-finalizado{background:#f3f4f6;color:#6b7280} .e-finalizado .dot{background:#d1d5db}
.e-no_disponible{background:#1f2937;color:#9ca3af} .e-no_disponible .dot{background:#4b5563}

/* ruta */
.ruta{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.03);border:1px solid var(--borde);border-radius:var(--r);padding:9px 11px;margin-bottom:10px}
.ruta-col{flex:1;min-width:0}
.ruta-lbl{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gris);margin-bottom:2px}
.ruta-val{font-size:12px;font-weight:700;color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ruta-col.r{text-align:right}
.ruta-arr{flex-shrink:0;color:#9ca3af}

/* meta */
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.mi{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--gris)}
.mi strong{color:var(--texto);font-weight:600}
.mi.azul{color:var(--azul-tx)} .mi.azul strong{color:var(--azul-tx)}
.gps-a{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:5px 11px;border-radius:8px;background:var(--azul-cl);color:var(--azul-tx);font-size:12px;font-weight:700;text-decoration:none}
.obs{margin-top:9px;padding:7px 10px;background:var(--naranja-cl);color:var(--naranja);border-radius:8px;font-size:12px;display:flex;gap:6px;align-items:flex-start;line-height:1.4}

/* BOTONES DE ESTADO — modo voluntario */
.estado-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.eb{padding:9px 6px;border-radius:9px;border:1.5px solid;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;font-family:inherit}
.eb:active{transform:scale(.96)}
.eb-esp{border-color:#d1d5db;background:#f3f4f6;color:#374151}
.eb-emb{border-color:#86efac;background:var(--verde-cl);color:var(--verde)}
.eb-rut{border-color:#93c5fd;background:var(--azul-cl);color:var(--azul-tx)}
.eb-fin{border-color:#d1d5db;background:#f9fafb;color:#6b7280}
.eb.activo{box-shadow:inset 0 0 0 2px currentColor}

/* MODAL ADMIN */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:200}
@media(min-width:600px){.overlay{align-items:center;padding:16px}}
.modal{background:var(--blanco);border-radius:18px 18px 0 0;width:100%;max-width:440px;max-height:93vh;overflow-y:auto;padding:20px}
@media(min-width:600px){.modal{border-radius:var(--rlg)}}
.handle{width:36px;height:4px;background:var(--borde);border-radius:2px;margin:0 auto 16px}
@media(min-width:600px){.handle{display:none}}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-title{font-size:16px;font-weight:700}
.modal-close{width:28px;height:28px;border-radius:7px;border:1px solid var(--borde);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--gris)}
.f{margin-bottom:13px}
.f label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--gris);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:10px 12px;border:1.5px solid var(--borde);border-radius:var(--r);font-size:14px;color:var(--texto);background:var(--blanco);font-family:inherit;transition:border-color .15s}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
.f textarea{resize:vertical;min-height:65px}
.fdiv{height:1px;background:var(--borde);margin:4px 0 14px}
.modal-btns{display:flex;gap:8px;margin-top:18px}
.btn-c{flex:1;padding:11px;border-radius:var(--r);border:1.5px solid var(--borde);background:none;font-size:14px;color:var(--gris);cursor:pointer;font-family:inherit;font-weight:500}
.btn-s{flex:2;padding:11px;border-radius:var(--r);border:none;background:var(--azul);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-s:hover{background:#1e40af}
.btn-s:disabled{background:#93c5fd;cursor:not-allowed}

/* ADMIN extras */
.adm-edit-btn{width:100%;margin-top:11px;padding:7px;border-radius:8px;border:1px solid var(--borde);background:none;font-size:12px;font-weight:600;color:var(--gris);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;font-family:inherit}
.adm-edit-btn:hover{background:var(--gris-cl);color:var(--texto)}

/* AVISO */
.aviso{margin-top:20px;padding:12px 14px;background:var(--naranja-cl);border-radius:var(--rlg);border:1px solid #fcd34d;font-size:12px;color:var(--naranja);line-height:1.5;display:flex;gap:8px}
.vacio{grid-column:1/-1;text-align:center;padding:40px;color:var(--gris)}

/* CLAVE modal */
.clave-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.clave-box{background:var(--blanco);border-radius:var(--rlg);padding:28px;width:100%;max-width:340px;text-align:center}
.clave-title{font-size:17px;font-weight:700;margin-bottom:6px}
.clave-sub{font-size:13px;color:var(--gris);margin-bottom:18px}
.clave-input{width:100%;padding:12px;border:1.5px solid var(--borde);border-radius:var(--r);font-size:18px;text-align:center;letter-spacing:4px;font-family:inherit;margin-bottom:12px}
.clave-input:focus{outline:none;border-color:var(--azul)}
.clave-btn{width:100%;padding:12px;border:none;border-radius:var(--r);background:var(--azul);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.clave-err{color:var(--rojo);font-size:13px;margin-top:8px;display:none}

@media(max-width:600px){
  .main{padding:12px 12px 40px}
  .filt-sec,.prox-sec,.banner{padding:0 12px}
  .filt-sec{padding:0 12px}
}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;color:#6b7280">
    <div style="width:30px;height:30px;border:3px solid #e5e7eb;border-top-color:#1a56db;border-radius:50%;animation:spin .8s linear infinite"></div>
    <div style="font-size:13px;font-weight:500">Conectando...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({ databaseURL:"https://cmude-transporte-2026-default-rtdb.firebaseio.com" });
const db  = getDatabase(app);

const CLAVE_ADMIN = "cmude2026";

const RUTAS = [
  { id:"hc_usfq",  label:"Hotel Hilton Colón → USFQ",           desde:"Hotel Hilton Colón", hasta:"USFQ"              },
  { id:"hc_uasb",  label:"Hotel Hilton Colón → UASB-E",          desde:"Hotel Hilton Colón", hasta:"UASB-E"             },
  { id:"usfq_hc",  label:"USFQ → Hotel Hilton Colón",            desde:"USFQ",               hasta:"Hotel Hilton Colón" },
  { id:"uasb_hc",  label:"UASB-E → Hotel Hilton Colón",          desde:"UASB-E",             hasta:"Hotel Hilton Colón" },
  { id:"uasb_usfq",label:"UASB-E → USFQ",                        desde:"UASB-E",             hasta:"USFQ"              },
  { id:"otro",     label:"Otro (especificar)",                    desde:"",                   hasta:""                  },
];

const ESTADOS = {
  no_disponible:{ label:"No disponible", cls:"e-no_disponible" },
  esperando:    { label:"Esperando",     cls:"e-esperando"     },
  embarcando:   { label:"Embarcando",    cls:"e-embarcando"    },
  en_ruta:      { label:"En ruta",       cls:"e-en_ruta"       },
  finalizado:   { label:"Finalizado",    cls:"e-finalizado"    },
};

// ── Modo desde URL ──
const params  = new URLSearchParams(window.location.search);
const modoURL = params.get("modo"); // null | "voluntario" | "admin"
const claveURL= params.get("clave");

let modo      = "publica"; // publica | voluntario | admin
let claveOk   = false;
let buses     = [];
let anuncio   = { activo:false, texto:"" };
let filtro    = "todos";
let editBus   = null;
let saving    = false;
let claveModal= false; // mostrar modal de clave

// Detectar modo
if (modoURL === "voluntario") {
  modo = "voluntario";
} else if (modoURL === "admin") {
  if (claveURL === CLAVE_ADMIN) {
    modo = "admin"; claveOk = true;
  } else {
    claveModal = true; // pedir clave
  }
}

// ── Firebase ──
onValue(ref(db,"buses"), snap => {
  const d = snap.val();
  buses = d ? Object.values(d).sort((a,b)=>a.id-b.id) : [];
  render();
});
onValue(ref(db,"anuncio"), snap => {
  anuncio = snap.val() || { activo:false, texto:"" };
  render();
});

// ── SVGs ──
const S = {
  bus:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M2 10h20M7 18v2M17 18v2"/></svg>`,
  mega: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>`,
  pin:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  arr:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
  clk:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  up:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`,
  gps:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>`,
  warn: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  x:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
};
const ic = (n,s=16) => `<span style="display:inline-flex;align-items:center;width:${s}px;height:${s}px;flex-shrink:0">${S[n]}</span>`;

// ── Helpers ──
function rutaDeBus(bus) {
  if (!bus.rutaId) return { desde: bus.desde||"—", hasta: bus.hasta||"—" };
  if (bus.rutaId === "otro") return { desde: bus.otroDesde||"—", hasta: bus.otroHasta||"—" };
  const r = RUTAS.find(r => r.id === bus.rutaId);
  return r ? { desde: r.desde, hasta: r.hasta } : { desde:"—", hasta:"—" };
}

// ── Banner ──
function htmlBanner() {
  if (!anuncio.activo || !anuncio.texto) return "";
  return `<div class="banner-wrap"><div class="banner on">
    <div class="banner-in">
      <div class="banner-ic">${ic("mega",17)}</div>
      <div><div class="banner-tag">Aviso de transporte</div><div class="banner-msg">${anuncio.texto}</div></div>
    </div></div></div>`;
}

// ── Próximos ──
function htmlProximos() {
  const ahora  = buses.filter(b => b.estado === "embarcando");
  const pronto = buses.filter(b => b.estado === "esperando" && b.horaEmbarque)
                      .sort((a,b) => a.horaEmbarque.localeCompare(b.horaEmbarque));
  const horaMin = pronto.length ? pronto[0].horaEmbarque : null;
  const proximos = horaMin ? pronto.filter(b => b.horaEmbarque === horaMin) : [];
  if (!ahora.length && !proximos.length) return "";

  const fila = (bus, tipo) => {
    const { desde, hasta } = rutaDeBus(bus);
    const hora = tipo === "ahora" ? "AHORA" : bus.horaEmbarque;
    const pill = tipo === "ahora" ? "Embarcando" : "Próximo";
    return `<div class="prox-row ${tipo}">
      <div class="prox-hora">${hora}</div>
      <div class="prox-div"></div>
      <div class="prox-data">
        <div class="prox-placa">${bus.placa || `Bus ${String(bus.id).padStart(2,"0")}`}</div>
        <div class="prox-ruta">${ic("pin",11)} ${desde} ${ic("arr",11)} ${hasta}</div>
      </div>
      <span class="prox-pill">${pill}</span>
    </div>`;
  };

  return `<div class="prox-sec"><div class="prox-in">
    <div class="sec-lbl">${ic("clk",12)} Embarques activos y próximos</div>
    <div class="prox-list">
      ${ahora.map(b=>fila(b,"ahora")).join("")}
      ${proximos.map(b=>fila(b,"pronto")).join("")}
    </div></div></div>`;
}

// ── Tarjeta ──
function htmlCard(bus) {
  const est    = ESTADOS[bus.estado] || ESTADOS.no_disponible;
  const noDisp = bus.estado === "no_disponible";
  const enRuta = bus.estado === "en_ruta";
  const { desde, hasta } = rutaDeBus(bus);
  const esVol  = modo === "voluntario";
  const esAdm  = modo === "admin";

  return `<div class="card ${bus.estado}">
    <div class="card-top">
      <div>
        <div class="card-placa">${bus.placa || "Sin placa"}</div>
        ${!noDisp ? `<div class="card-num">Bus ${String(bus.id).padStart(2,"0")}</div>` : ""}
      </div>
      <span class="est ${est.cls}"><span class="dot"></span>${est.label}</span>
    </div>

    ${!noDisp ? `
    <div class="ruta">
      <div class="ruta-col">
        <div class="ruta-lbl">Desde</div>
        <div class="ruta-val">${desde}</div>
      </div>
      <div class="ruta-arr">${ic("arr",14)}</div>
      <div class="ruta-col r">
        <div class="ruta-lbl">Hasta</div>
        <div class="ruta-val">${hasta}</div>
      </div>
    </div>

    <div class="meta">
      ${bus.horaEmbarque && !enRuta && bus.estado!=="finalizado" ? `
        <div class="mi azul">${ic("clk",13)} Embarque: <strong>${bus.horaEmbarque}</strong></div>` : ""}
      ${bus.horaSalida ? `
        <div class="mi">${ic("up",13)} Salió: <strong>${bus.horaSalida}</strong></div>` : ""}
      ${!bus.horaEmbarque && !bus.horaSalida ? `
        <div class="mi" style="color:#9ca3af">${ic("clk",13)} Sin horario aún</div>` : ""}
    </div>

    ${enRuta && bus.gpsLink ? `
      <a href="${bus.gpsLink}" target="_blank" class="gps-a">${ic("gps",13)} Ubicación en tiempo real</a>` : ""}
    ` : ""}

    ${bus.observaciones ? `<div class="obs">${ic("warn",13)} ${bus.observaciones}</div>` : ""}

    ${esVol && !noDisp ? `
      <div class="estado-btns">
        <button class="eb eb-esp ${bus.estado==="esperando"?"activo":""}"
          onclick="window._setEstado(${bus.id},'esperando')">⏳ Esperando</button>
        <button class="eb eb-emb ${bus.estado==="embarcando"?"activo":""}"
          onclick="window._setEstado(${bus.id},'embarcando')">🟢 Embarcando</button>
        <button class="eb eb-rut ${bus.estado==="en_ruta"?"activo":""}"
          onclick="window._setEstado(${bus.id},'en_ruta')">🔵 En ruta</button>
        <button class="eb eb-fin ${bus.estado==="finalizado"?"activo":""}"
          onclick="window._setEstado(${bus.id},'finalizado')">✅ Finalizado</button>
      </div>
      <button class="adm-edit-btn" style="margin-top:8px" onclick="window._editVol(${bus.id})">
        ${ic("edit",13)} GPS y observaciones
      </button>` : ""}

    ${esAdm ? `
      <button class="adm-edit-btn" onclick="window._edit(${bus.id})">
        ${ic("edit",13)} Editar datos completos
      </button>` : ""}
  </div>`;
}

// ── Modal voluntaria (GPS + observaciones) ──
function htmlModalVol(bus) {
  return `<div class="overlay" id="overlay" onclick="window._closeMod(event)">
    <div class="modal">
      <div class="handle"></div>
      <div class="modal-hdr">
        <span class="modal-title">${bus.placa || `Bus ${String(bus.id).padStart(2,"0")}`}</span>
        <button class="modal-close" onclick="window._cerrar()">${ic("x",14)}</button>
      </div>

      <div class="f">
        <label>Link GPS — ubicación en tiempo real</label>
        <input type="text" id="fv-gps" placeholder="Pega aquí el link de WhatsApp o Google Maps"
          value="${bus.gpsLink||""}" style="font-size:13px"/>
        <div style="font-size:11px;color:var(--gris);margin-top:5px;line-height:1.5">
          📍 Google Maps → tu foto de perfil → "Compartir ubicación" → selecciona duración → "Copiar link" → pega aquí.
        </div>
      </div>

      <div class="fdiv"></div>

      <div class="f">
        <label>Hora de salida</label>
        ${bus.horaSalida
          ? `<div style="display:flex;align-items:center;gap:8px">
               <div style="flex:1;padding:10px 12px;border:1.5px solid var(--borde);border-radius:var(--r);font-size:14px;font-weight:600;color:var(--texto)">${bus.horaSalida}</div>
               <button onclick="window._clearSalida(${bus.id})" style="padding:10px 12px;border:1.5px solid var(--borde);border-radius:var(--r);background:none;font-size:12px;color:var(--gris);cursor:pointer;font-family:inherit;white-space:nowrap">Borrar</button>
             </div>`
          : `<button onclick="window._setSalida(${bus.id})" style="width:100%;padding:11px;border:1.5px solid #86efac;border-radius:var(--r);background:var(--verde-cl);color:var(--verde);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">
               🕐 Registrar hora de salida ahora
             </button>`
        }
        <input type="hidden" id="fv-salida" value="${bus.horaSalida||""}"/>
      </div>

      <div class="fdiv"></div>

      <div class="f">
        <label>Observaciones</label>
        <textarea id="fv-obs" placeholder="ej: Retrasados por tráfico en Av. Naciones Unidas">${bus.observaciones||""}</textarea>
      </div>

      <div class="modal-btns">
        <button class="btn-c" onclick="window._cerrar()">Cancelar</button>
        <button class="btn-s" id="btn-save" onclick="window._saveVol(${bus.id})">Guardar</button>
      </div>
    </div>
  </div>`;
}

// ── Modal admin ──
function htmlModal(bus) {
  const rutaOpts = RUTAS.map(r =>
    `<option value="${r.id}" ${bus.rutaId===r.id?"selected":""}>${r.label}</option>`
  ).join("");
  const esOtro = bus.rutaId === "otro";

  return `<div class="overlay" id="overlay" onclick="window._closeMod(event)">
    <div class="modal">
      <div class="handle"></div>
      <div class="modal-hdr">
        <span class="modal-title">${bus.placa || `Bus ${String(bus.id).padStart(2,"0")}`}</span>
        <button class="modal-close" onclick="window._cerrar()">${ic("x",14)}</button>
      </div>

      <div class="f">
        <label>Placa</label>
        <input type="text" id="f-placa" placeholder="ej: ABC-1234" value="${bus.placa||""}" style="text-transform:uppercase"/>
      </div>
      <div class="f">
        <label>Estado</label>
        <select id="f-estado">
          ${Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}" ${bus.estado===k?"selected":""}>${v.label}</option>`).join("")}
        </select>
      </div>

      <div class="fdiv"></div>

      <div class="f">
        <label>Ruta</label>
        <select id="f-ruta" onchange="window._toggleOtro()">
          <option value="">— Sin ruta asignada —</option>
          ${rutaOpts}
        </select>
      </div>
      <div id="otro-wrap" style="display:${esOtro?"block":"none"}">
        <div class="f">
          <label>Origen (Otro)</label>
          <input type="text" id="f-otro-desde" placeholder="ej: Aeropuerto" value="${bus.otroDesde||""}"/>
        </div>
        <div class="f">
          <label>Destino (Otro)</label>
          <input type="text" id="f-otro-hasta" placeholder="ej: Terminal Terrestre" value="${bus.otroHasta||""}"/>
        </div>
      </div>

      <div class="fdiv"></div>

      <div class="f">
        <label>Hora de embarque</label>
        <input type="text" id="f-embarque" placeholder="ej: 10:00" value="${bus.horaEmbarque||""}"/>
      </div>
      <div class="f">
        <label>Hora de salida</label>
        <input type="text" id="f-salida" placeholder="—" value="${bus.horaSalida||""}"/>
      </div>
      <div class="f">
        <label>Link GPS</label>
        <input type="text" id="f-gps" placeholder="https://maps.app.goo.gl/..." value="${bus.gpsLink||""}"/>
      </div>

      <div class="fdiv"></div>

      <div class="f">
        <label>Observaciones</label>
        <textarea id="f-obs">${bus.observaciones||""}</textarea>
      </div>

      <div class="modal-btns">
        <button class="btn-c" onclick="window._cerrar()">Cancelar</button>
        <button class="btn-s" id="btn-save" onclick="window._save(${bus.id})">Guardar cambios</button>
      </div>
    </div>
  </div>`;
}

// ── Modal clave admin ──
function htmlClaveModal() {
  return `<div class="clave-overlay">
    <div class="clave-box">
      <div style="margin-bottom:12px">${ic("lock",28)}</div>
      <div class="clave-title">Acceso administrador</div>
      <div class="clave-sub">Ingresa la clave para continuar</div>
      <input class="clave-input" type="password" id="clave-inp" placeholder="••••••••"
        onkeydown="if(event.key==='Enter')window._checkClave()"/>
      <button class="clave-btn" onclick="window._checkClave()">Entrar</button>
      <div class="clave-err" id="clave-err">Clave incorrecta</div>
    </div>
  </div>`;
}

// ── Render principal ──
function render() {
  if (claveModal) {
    document.getElementById("app").innerHTML = htmlClaveModal();
    return;
  }
  if (!buses.length) return;

  const filtrados = filtro==="todos" ? buses : buses.filter(b=>b.estado===filtro);
  const cnt = {};
  Object.keys(ESTADOS).forEach(k=>{ cnt[k]=buses.filter(b=>b.estado===k).length; });

  document.getElementById("app").innerHTML = `
    <header class="hdr">
      <div class="hdr-in">
        <div class="logo">
          <div class="logo-ic">${ic("bus",18)}</div>
          <div class="logo-txt">Transporte CMUDE 2026</div>
        </div>
        ${modo==="voluntario" ? `<div class="modo-badge modo-vol">✏️ Voluntario</div>` : ""}
        ${modo==="admin"      ? `<div class="modo-badge modo-adm">${ic("lock",13)} Admin</div>` : ""}
        <div class="sync-dot" title="Conectado en tiempo real"></div>
      </div>
      ${anuncio.activo && anuncio.texto ? `
        <div class="banner on">
          <div class="banner-in">
            <div class="banner-ic">${ic("mega",16)}</div>
            <div>
              <div class="banner-tag">Aviso de transporte</div>
              <div class="banner-msg">${anuncio.texto}</div>
            </div>
          </div>
        </div>` : ""}
    </header>
    ${modo==="publica" ? htmlProximos() : ""}

    <div class="filt-sec"><div class="filt-in">
      <button class="fb ${filtro==="todos"?"on":""}" onclick="window._filt('todos')">
        Todos <span class="ct">${buses.length}</span>
      </button>
      ${Object.entries(ESTADOS).map(([k,v])=>`
        <button class="fb ${filtro===k?"on":""}" onclick="window._filt('${k}')">
          ${v.label} <span class="ct">${cnt[k]}</span>
        </button>`).join("")}
    </div></div>

    <div class="main"><div class="grid">
      ${filtrados.length
        ? filtrados.map(htmlCard).join("")
        : `<div class="vacio">No hay buses en este estado.</div>`}
    </div>
    ${modo==="voluntario" ? `
      <div class="aviso">${ic("info",14)}
        <div style="margin-left:4px"><strong>Modo voluntario.</strong>
        Usa los botones de cada tarjeta para cambiar el estado de tu bus.
        Los cambios se reflejan al instante para todas las participantes.</div>
      </div>` : ""}
    ${modo==="admin" ? `
      <div class="aviso">${ic("info",14)}
        <div style="margin-left:4px"><strong>Modo administrador.</strong>
        Puedes editar todos los datos de cada bus y el anuncio del banner.</div>
      </div>` : ""}
    </div>

    ${editBus && editBus._volModal ? htmlModalVol(editBus) : editBus ? htmlModal(editBus) : ""}`;
}

// ── Verificar clave ──
function checkClave() {
  const val = document.getElementById("clave-inp").value;
  if (val === CLAVE_ADMIN) {
    modo = "admin"; claveModal = false; claveOk = true;
    render();
  } else {
    document.getElementById("clave-err").style.display = "block";
  }
}

// ── Cambiar estado rápido (voluntario) ──
async function setEstado(id, estado) {
  try {
    await update(ref(db,`buses/${id}`), { estado });
  } catch(e) {
    alert("Error al guardar. Verifica tu conexión.");
  }
}

// ── Toggle campo Otro ──
function toggleOtro() {
  const sel  = document.getElementById("f-ruta");
  const wrap = document.getElementById("otro-wrap");
  if (wrap) wrap.style.display = sel.value === "otro" ? "block" : "none";
}

// ── Guardar (admin) ──
async function save(id) {
  const rutaId = document.getElementById("f-ruta").value;
  const datos = {
    placa:        document.getElementById("f-placa").value.trim().toUpperCase(),
    estado:       document.getElementById("f-estado").value,
    rutaId,
    otroDesde:    rutaId==="otro" ? document.getElementById("f-otro-desde").value.trim() : "",
    otroHasta:    rutaId==="otro" ? document.getElementById("f-otro-hasta").value.trim() : "",
    horaEmbarque: document.getElementById("f-embarque").value.trim(),
    horaSalida:   document.getElementById("f-salida").value.trim(),
    gpsLink:      document.getElementById("f-gps").value.trim(),
    observaciones:document.getElementById("f-obs").value.trim(),
  };
  const anuncioTxt = document.getElementById("f-anuncio").value.trim();
  const anuncioOn  = document.getElementById("f-anuncio-on").checked;

  const btn = document.getElementById("btn-save");
  if (btn) { btn.disabled=true; btn.textContent="Guardando..."; }

  editBus = null;

  try {
    await update(ref(db,`buses/${id}`), datos);
  } catch(e) {
    console.error("Error al guardar:", e);
  }
}

// ── Exponer ──
window._setSalida  = async (id) => {
  const hora = new Date().toLocaleTimeString("es-EC",{hour:"2-digit",minute:"2-digit"});
  try {
    await update(ref(db,`buses/${id}`), { horaSalida: hora });
    // Actualizar el bus local para re-renderizar el modal
    const b = buses.find(b=>b.id===id);
    if(b){ b.horaSalida=hora; b._volModal=true; editBus=b; render(); }
  } catch(e) { alert("Error al guardar."); }
};
window._clearSalida = async (id) => {
  try {
    await update(ref(db,`buses/${id}`), { horaSalida: "" });
    const b = buses.find(b=>b.id===id);
    if(b){ b.horaSalida=""; b._volModal=true; editBus=b; render(); }
  } catch(e) { alert("Error al guardar."); }
};
window._filt       = f => { filtro=f; render(); };
window._edit       = id => { editBus=buses.find(b=>b.id===id); render(); };
window._editVol    = id => { editBus=buses.find(b=>b.id===id); editBus._volModal=true; render(); };
window._cerrar     = () => { editBus=null; render(); };
window._closeMod   = e => { if(e.target.id==="overlay"){editBus=null;render();} };
window._save       = save;
window._saveVol    = async (id) => {
  const datos = {
    gpsLink:      document.getElementById("fv-gps").value.trim(),
    horaSalida:   document.getElementById("fv-salida").value.trim(),
    observaciones:document.getElementById("fv-obs").value.trim(),
  };
  const btn = document.getElementById("btn-save");
  if (btn) { btn.disabled=true; btn.textContent="Guardando..."; }
  editBus = null;
  try {
    await update(ref(db,`buses/${id}`), datos);
  } catch(e) {
    console.error("Error al guardar:", e);
  }
};
window._setEstado  = setEstado;
window._toggleOtro = toggleOtro;
window._checkClave = checkClave;
</script>
</body>
</html>
