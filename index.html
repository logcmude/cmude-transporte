<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Transporte CMUDE 2026</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --azul: #1a56db; --azul-claro: #e8f0fe; --azul-texto: #1e40af;
  --verde: #166534; --verde-claro: #dcfce7;
  --rojo: #991b1b; --rojo-claro: #fee2e2;
  --naranja: #92400e; --naranja-claro: #fef3c7;
  --gris: #f3f4f6; --gris-borde: #e5e7eb;
  --texto: #111827; --texto-muted: #6b7280; --blanco: #ffffff;
  --radio: 10px; --radio-lg: 14px;
}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: var(--texto); min-height: 100vh; font-size: 14px; }
@keyframes pulso { 0%,100%{opacity:1} 50%{opacity:.35} }
@keyframes spin   { to{transform:rotate(360deg)} }

/* ── HEADER ── */
.header { background: var(--blanco); border-bottom: 1px solid var(--gris-borde); padding: 0 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 54px; gap: 12px; }
.logo { display: flex; align-items: center; gap: 9px; }
.logo-icon { width: 34px; height: 34px; background: var(--azul); border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.logo-icon svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.logo-titulo { font-weight: 700; font-size: 15px; letter-spacing: -.3px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulso 2s infinite; flex-shrink: 0; }

/* ── BANNER ── */
.banner-wrap { position: sticky; top: 54px; z-index: 90; }
.banner { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); padding: 0 20px; display: none; }
.banner.visible { display: block; }
.banner-inner { max-width: 960px; margin: 0 auto; padding: 14px 0 16px; display: flex; gap: 12px; align-items: flex-start; }
.banner-icon-wrap { flex-shrink: 0; width: 36px; height: 36px; background: rgba(255,255,255,.15); border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.banner-icon-wrap svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.banner-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .8px; color: #93c5fd; margin-bottom: 5px; }
.banner-msg { font-size: 14px; font-weight: 500; color: #fff; line-height: 1.55; }

/* ── PRÓXIMOS ── */
.proximos-section { background: var(--blanco); border-bottom: 1px solid var(--gris-borde); padding: 0 20px; }
.proximos-inner { max-width: 960px; margin: 0 auto; padding: 14px 0; }
.section-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .7px; color: var(--texto-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.proximos-grid { display: flex; flex-direction: column; gap: 7px; }
.proximo-card { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-radius: var(--radio); border: 1.5px solid; }
.proximo-card.ahora { background: var(--verde-claro); border-color: #86efac; }
.proximo-card.pronto { background: var(--azul-claro); border-color: #93c5fd; }
.proximo-hora { font-size: 17px; font-weight: 800; min-width: 52px; line-height: 1; }
.proximo-card.ahora .proximo-hora { color: var(--verde); }
.proximo-card.pronto .proximo-hora { color: var(--azul-texto); }
.proximo-divider { width: 1px; height: 30px; flex-shrink: 0; }
.proximo-card.ahora .proximo-divider { background: #86efac; }
.proximo-card.pronto .proximo-divider { background: #93c5fd; }
.proximo-data { flex: 1; min-width: 0; }
.proximo-bus { font-size: 13px; font-weight: 700; color: var(--texto); }
.proximo-ruta { font-size: 12px; color: var(--texto-muted); margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.proximo-pill { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; padding: 3px 8px; border-radius: 6px; flex-shrink: 0; }
.proximo-card.ahora .proximo-pill { background: #16a34a; color: #fff; }
.proximo-card.pronto .proximo-pill { background: var(--azul); color: #fff; }

/* ── FILTROS ── */
.filtros-section { padding: 0 20px; }
.filtros-inner { max-width: 960px; margin: 0 auto; padding: 14px 0 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.filtro-btn { padding: 5px 13px; border-radius: 20px; border: 1px solid var(--gris-borde); background: var(--blanco); font-size: 12px; font-weight: 500; color: var(--texto-muted); cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 5px; }
.filtro-btn:hover { border-color: #9ca3af; color: var(--texto); }
.filtro-btn.activo { background: var(--texto); color: #fff; border-color: var(--texto); }
.badge { border-radius: 9px; padding: 0 5px; font-size: 10px; font-weight: 700; }
.filtro-btn.activo .badge { background: rgba(255,255,255,.25); }
.filtro-btn:not(.activo) .badge { background: var(--gris); color: var(--texto-muted); }

/* ── GRID ── */
.main { max-width: 960px; margin: 0 auto; padding: 16px 20px 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 12px; }

/* ── TARJETA ── */
.card { background: var(--blanco); border: 1.5px solid var(--gris-borde); border-radius: var(--radio-lg); padding: 16px; transition: box-shadow .15s; }
.card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.08); }
.card.embarcando { border-color: #86efac; }
.card.en_ruta    { border-color: #93c5fd; }
.card.no_disponible { opacity: .65; }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.bus-num { font-size: 19px; font-weight: 800; letter-spacing: -.4px; }

/* estados */
.badge-estado { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700; }
.badge-estado .dot { width: 6px; height: 6px; border-radius: 50%; }
.s-esperando    { background:#f3f4f6; color:#374151; } .s-esperando .dot    { background:#9ca3af; }
.s-embarcando   { background:var(--verde-claro); color:var(--verde); } .s-embarcando .dot   { background:#22c55e; animation:pulso 1.5s infinite; }
.s-en_ruta      { background:var(--azul-claro); color:var(--azul-texto); } .s-en_ruta .dot      { background:#3b82f6; animation:pulso 2s infinite; }
.s-finalizado   { background:#f3f4f6; color:#6b7280; } .s-finalizado .dot   { background:#d1d5db; }
.s-no_disponible{ background:#1f2937; color:#9ca3af; } .s-no_disponible .dot{ background:#4b5563; }

/* ruta */
.ruta-box { display: flex; align-items: center; gap: 8px; background: #f8fafc; border: 1px solid var(--gris-borde); border-radius: var(--radio); padding: 10px 12px; margin-bottom: 10px; }
.ruta-col { flex: 1; min-width: 0; }
.ruta-label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; color: var(--texto-muted); margin-bottom: 3px; }
.ruta-val { font-size: 12px; font-weight: 600; color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ruta-col.right { text-align: right; }
.ruta-arrow { flex-shrink: 0; color: #9ca3af; }

/* cap */
.cap-row { font-size: 12px; color: var(--texto-muted); display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
.cap-row strong { color: var(--texto); font-weight: 700; font-size: 14px; }

/* meta */
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; }
.meta-item { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--texto-muted); }
.meta-item strong { color: var(--texto); font-weight: 600; }
.meta-item.blue { color: var(--azul-texto); }
.meta-item.blue strong { color: var(--azul-texto); }
.gps-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; padding: 5px 11px; border-radius: 8px; background: var(--azul-claro); color: var(--azul-texto); font-size: 12px; font-weight: 700; text-decoration: none; }
.obs-box { margin-top: 10px; padding: 7px 10px; background: var(--naranja-claro); color: var(--naranja); border-radius: 8px; font-size: 12px; display: flex; gap: 6px; align-items: flex-start; line-height: 1.4; }
.btn-edit { width: 100%; margin-top: 12px; padding: 7px; border-radius: 8px; border: 1px solid var(--gris-borde); background: none; font-size: 12px; font-weight: 600; color: var(--texto-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: all .15s; }
.btn-edit:hover { background: var(--gris); color: var(--texto); }

/* ── MODAL ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
@media(min-width:600px){ .overlay { align-items: center; padding: 16px; } }
.modal { background: var(--blanco); border-radius: 18px 18px 0 0; width: 100%; max-width: 430px; max-height: 92vh; overflow-y: auto; padding: 20px; }
@media(min-width:600px){ .modal { border-radius: var(--radio-lg); } }
.handle { width: 36px; height: 4px; background: var(--gris-borde); border-radius: 2px; margin: 0 auto 16px; }
@media(min-width:600px){ .handle { display:none; } }
.modal-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--gris-borde); background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--texto-muted); }
.field { margin-bottom: 13px; }
.field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--texto-muted); margin-bottom: 5px; }
.field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--gris-borde); border-radius: var(--radio); font-size: 14px; color: var(--texto); background: var(--blanco); font-family: inherit; transition: border-color .15s; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(26,86,219,.1); }
.field textarea { resize: vertical; min-height: 65px; }
.field-divider { height: 1px; background: var(--gris-borde); margin: 4px 0 14px; }
.modal-btns { display: flex; gap: 8px; margin-top: 18px; }
.btn-cancel { flex:1; padding: 11px; border-radius: var(--radio); border: 1.5px solid var(--gris-borde); background: none; font-size: 14px; color: var(--texto-muted); cursor: pointer; font-family: inherit; font-weight: 500; }
.btn-save { flex:2; padding: 11px; border-radius: var(--radio); border: none; background: var(--azul); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .15s; }
.btn-save:hover { background: #1e40af; }
.btn-save:disabled { background: #93c5fd; cursor: not-allowed; }
.aviso-vol { margin-top: 20px; padding: 12px 14px; background: var(--naranja-claro); border-radius: var(--radio-lg); border: 1px solid #fcd34d; font-size: 12px; color: var(--naranja); line-height: 1.5; display: flex; gap: 8px; }
.vacio { grid-column:1/-1; text-align: center; padding: 40px; color: var(--texto-muted); }

@media(max-width:600px){
  .main { padding: 12px 12px 40px; }
  .filtros-section { padding: 0 12px; }
  .proximos-section, .banner { padding: 0 12px; }
}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:12px;color:#6b7280">
    <div style="width:30px;height:30px;border:3px solid #e5e7eb;border-top-color:#1a56db;border-radius:50%;animation:spin .8s linear infinite"></div>
    <div style="font-size:13px;font-weight:500">Conectando con Firebase...</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({ databaseURL: "https://cmude-transporte-2026-default-rtdb.firebaseio.com" });
const db  = getDatabase(app);

// ── Constantes ──
const DESTINOS = ["Hotel Hilton Colón", "USFQ", "UASB-E", "Aeropuerto", "Centro histórico", "Otro"];
const ESTADOS  = {
  esperando:    { label: "Esperando",     cls: "s-esperando"    },
  embarcando:   { label: "Embarcando",    cls: "s-embarcando"   },
  en_ruta:      { label: "En ruta",       cls: "s-en_ruta"      },
  finalizado:   { label: "Finalizado",    cls: "s-finalizado"   },
  no_disponible:{ label: "No disponible", cls: "s-no_disponible"},
};

// ── Estado ──
let buses   = [];
let anuncio = { activo: false, texto: "" };
let filtro  = "todos";
let editBus = null;
let saving  = false;

const ES_VOL = new URLSearchParams(window.location.search).get("modo") === "voluntario";

// ── Firebase ──
onValue(ref(db, "buses"), snap => {
  const d = snap.val();
  buses = d ? Object.values(d).sort((a,b) => a.id - b.id) : [];
  render();
});
onValue(ref(db, "anuncio"), snap => {
  anuncio = snap.val() || { activo: false, texto: "" };
  render();
});

// ── SVGs ──
const SVG = {
  bus:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M2 10h20M7 18v2M17 18v2"/></svg>`,
  mega:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>`,
  pin:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  arrow:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
  clock:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  up:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`,
  gps:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>`,
  warn:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  edit:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  users:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  x:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  info:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
};
const ic = (n, s=16) => `<span style="display:inline-flex;align-items:center;width:${s}px;height:${s}px;flex-shrink:0">${SVG[n]}</span>`;

// ── Banner ──
function htmlBanner() {
  if (!anuncio.activo || !anuncio.texto) return "";
  return `
    <div class="banner-wrap">
      <div class="banner visible">
        <div class="banner-inner">
          <div class="banner-icon-wrap">${ic("mega",18)}</div>
          <div>
            <div class="banner-tag">Aviso de transporte</div>
            <div class="banner-msg">${anuncio.texto}</div>
          </div>
        </div>
      </div>
    </div>`;
}

// ── Próximos embarques (automático) ──
function htmlProximos() {
  const ahora = buses.filter(b => b.estado === "embarcando");
  const pronto = buses
    .filter(b => b.estado === "esperando" && b.horaEmbarque)
    .sort((a,b) => a.horaEmbarque.localeCompare(b.horaEmbarque));

  // Tomar solo los de la hora más próxima
  let proximos = [];
  if (pronto.length > 0) {
    const horaMin = pronto[0].horaEmbarque;
    proximos = pronto.filter(b => b.horaEmbarque === horaMin);
  }

  if (ahora.length === 0 && proximos.length === 0) return "";

  const fila = (bus, tipo) => {
    const hora  = tipo === "ahora" ? "AHORA" : bus.horaEmbarque;
    const pill  = tipo === "ahora" ? "Embarcando" : "Próximo";
    return `
      <div class="proximo-card ${tipo}">
        <div class="proximo-hora">${hora}</div>
        <div class="proximo-divider"></div>
        <div class="proximo-data">
          <div class="proximo-bus">Bus ${String(bus.id).padStart(2,"0")}${bus.placa ? ` · ${bus.placa}` : ""}</div>
          <div class="proximo-ruta">
            ${ic("pin",11)} ${bus.ubicacionActual||"—"}
            ${ic("arrow",11)}
            ${bus.destino||"—"}
          </div>
        </div>
        <span class="proximo-pill">${pill}</span>
      </div>`;
  };

  return `
    <div class="proximos-section">
      <div class="proximos-inner">
        <div class="section-label">${ic("clock",12)} Embarques activos y próximos</div>
        <div class="proximos-grid">
          ${ahora.map(b => fila(b,"ahora")).join("")}
          ${proximos.map(b => fila(b,"pronto")).join("")}
        </div>
      </div>
    </div>`;
}

// ── Tarjeta ──
function htmlCard(bus) {
  const est    = ESTADOS[bus.estado] || ESTADOS.esperando;
  const noDisp = bus.estado === "no_disponible";
  const enRuta = bus.estado === "en_ruta";

  return `
    <div class="card ${bus.estado}">
      <div class="card-top">
        <div>
          <div class="bus-num">Bus ${String(bus.id).padStart(2,"0")}</div>
          ${bus.placa ? `<div style="font-size:11px;font-weight:700;color:var(--texto-muted);letter-spacing:.5px;margin-top:1px">${bus.placa}</div>` : ""}
        </div>
        <span class="badge-estado ${est.cls}"><span class="dot"></span>${est.label}</span>
      </div>

      ${noDisp ? "" : `
      <div class="ruta-box">
        <div class="ruta-col">
          <div class="ruta-label">Ubicación actual</div>
          <div class="ruta-val">${bus.ubicacionActual||"—"}</div>
        </div>
        <div class="ruta-arrow">${ic("arrow",14)}</div>
        <div class="ruta-col right">
          <div class="ruta-label">Destino</div>
          <div class="ruta-val">${bus.destino||"—"}</div>
        </div>
      </div>

      <div class="cap-row">${ic("users",14)} Capacidad: <strong>40</strong> personas</div>

      <div class="meta-row">
        ${bus.horaEmbarque && !enRuta && bus.estado!=="finalizado" ? `
          <div class="meta-item blue">${ic("clock",13)} Hora de embarque: <strong>${bus.horaEmbarque}</strong></div>` : ""}
        ${bus.horaSalida ? `
          <div class="meta-item">${ic("up",13)} Salió: <strong>${bus.horaSalida}</strong></div>` : ""}
        ${!bus.horaEmbarque && !bus.horaSalida ? `
          <div class="meta-item" style="color:#9ca3af">${ic("clock",13)} Sin horario aún</div>` : ""}
      </div>

      ${enRuta && bus.gpsLink ? `
        <a href="${bus.gpsLink}" target="_blank" class="gps-link">${ic("gps",13)} Ver ubicación en tiempo real</a>` : ""}
      `}

      ${bus.observaciones ? `<div class="obs-box">${ic("warn",13)} ${bus.observaciones}</div>` : ""}

      ${ES_VOL ? `<button class="btn-edit" onclick="window._edit(${bus.id})">${ic("edit",13)} Editar este bus</button>` : ""}
    </div>`;
}

// ── Modal ──
function htmlModal(bus) {
  const desOpts = DESTINOS.map(d =>
    `<option value="${d}" ${bus.destino===d?"selected":""}>${d}</option>`
  ).join("");
  const estOpts = Object.entries(ESTADOS).map(([k,v]) =>
    `<option value="${k}" ${bus.estado===k?"selected":""}>${v.label}</option>`
  ).join("");
  const ubicOpts = DESTINOS.map(d =>
    `<option value="${d}" ${bus.ubicacionActual===d?"selected":""}>${d}</option>`
  ).join("");

  return `
    <div class="overlay" id="overlay" onclick="window._closeMod(event)">
      <div class="modal">
        <div class="handle"></div>
        <div class="modal-hdr">
          <span class="modal-title">Bus ${String(bus.id).padStart(2,"0")}</span>
          <button class="modal-close" onclick="window._cerrar()">${ic("x",14)}</button>
        </div>

        <div class="field">
          <label>Placa del bus</label>
          <input type="text" id="f-placa" placeholder="ej: ABC-1234" value="${bus.placa||""}" style="text-transform:uppercase" />
        </div>
        <div class="field">
          <label>Estado</label>
          <select id="f-estado">${estOpts}</select>
        </div>

        <div class="field-divider"></div>

        <div class="field">
          <label>Ubicación actual del bus</label>
          <select id="f-ubic">${ubicOpts}</select>
        </div>
        <div class="field">
          <label>Destino</label>
          <select id="f-dest">${desOpts}</select>
        </div>

        <div class="field-divider"></div>

        <div class="field">
          <label>Hora de embarque</label>
          <input type="text" id="f-embarque" placeholder="ej: 10:00" value="${bus.horaEmbarque||""}" />
        </div>
        <div class="field">
          <label>Hora de salida</label>
          <input type="text" id="f-salida" placeholder="—" value="${bus.horaSalida||""}" />
        </div>
        <div class="field">
          <label>Link GPS (ubicación en tiempo real)</label>
          <input type="text" id="f-gps" placeholder="https://maps.app.goo.gl/..." value="${bus.gpsLink||""}" />
        </div>

        <div class="field-divider"></div>

        <div class="field">
          <label>Observaciones</label>
          <textarea id="f-obs">${bus.observaciones||""}</textarea>
        </div>

        <div class="modal-btns">
          <button class="btn-cancel" onclick="window._cerrar()">Cancelar</button>
          <button class="btn-save" id="btn-save" onclick="window._save(${bus.id})">
            Guardar cambios
          </button>
        </div>
      </div>
    </div>`;
}

// ── Render ──
function render() {
  if (buses.length === 0) return;
  const filtrados = filtro === "todos" ? buses : buses.filter(b => b.estado === filtro);
  const cnt = {};
  Object.keys(ESTADOS).forEach(k => { cnt[k] = buses.filter(b => b.estado===k).length; });

  document.getElementById("app").innerHTML = `
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <div class="logo-icon">${ic("bus",18)}</div>
          <div class="logo-titulo">Transporte CMUDE 2026</div>
        </div>
        ${ES_VOL ? `
          <div style="display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:var(--naranja-claro);border-radius:8px;font-size:12px;font-weight:700;color:var(--naranja)">
            ✏️ Modo voluntario
          </div>` : ""}
        <div class="sync-dot" title="Conectado en tiempo real"></div>
      </div>
    </header>

    ${htmlBanner()}
    ${htmlProximos()}

    <div class="filtros-section">
      <div class="filtros-inner">
        <button class="filtro-btn ${filtro==="todos"?"activo":""}" onclick="window._filt('todos')">
          Todos <span class="badge">${buses.length}</span>
        </button>
        ${Object.entries(ESTADOS).map(([k,v]) => `
          <button class="filtro-btn ${filtro===k?"activo":""}" onclick="window._filt('${k}')">
            ${v.label} <span class="badge">${cnt[k]}</span>
          </button>`).join("")}
      </div>
    </div>

    <div class="main">
      <div class="grid">
        ${filtrados.length > 0
          ? filtrados.map(htmlCard).join("")
          : `<div class="vacio">No hay buses en este estado.</div>`}
      </div>
      ${ES_VOL ? `
        <div class="aviso-vol">
          ${ic("info",14)}
          <div style="margin-left:4px">
            <strong>Modo voluntario activo.</strong> Edita únicamente tu bus asignado.
            Los cambios se reflejan al instante para todas las participantes.
          </div>
        </div>` : ""}
    </div>

    ${editBus ? htmlModal(editBus) : ""}`;
}

// ── Guardar en Firebase ──
// CRÍTICO: leer DOM ANTES de cualquier render()
async function save(id) {
  // 1. Leer todos los valores del DOM mientras el modal existe
  const datos = {
    placa:           document.getElementById("f-placa").value.trim().toUpperCase(),
    estado:          document.getElementById("f-estado").value,
    ubicacionActual: document.getElementById("f-ubic").value,
    destino:         document.getElementById("f-dest").value,
    horaEmbarque:    document.getElementById("f-embarque").value.trim(),
    horaSalida:      document.getElementById("f-salida").value.trim(),
    gpsLink:         document.getElementById("f-gps").value.trim(),
    observaciones:   document.getElementById("f-obs").value.trim(),
  };

  // 2. Deshabilitar botón visualmente sin re-renderizar
  const btn = document.getElementById("btn-save");
  if (btn) { btn.disabled = true; btn.textContent = "Guardando..."; }

  try {
    await update(ref(db, `buses/${id}`), datos);
    editBus = null; // Firebase onValue disparará render() automáticamente
  } catch(e) {
    alert("Error al guardar. Verifica tu conexión a internet.");
    if (btn) { btn.disabled = false; btn.textContent = "Guardar cambios"; }
  }
}

// ── Exponer ──
window._filt     = f => { filtro = f; render(); };
window._edit     = id => { editBus = buses.find(b => b.id === id); render(); };
window._cerrar   = () => { editBus = null; render(); };
window._closeMod = e => { if (e.target.id==="overlay") { editBus=null; render(); } };
window._save     = save;
</script>
</body>
</html>
